            Cenový limit: ${level.budget ? level.budget + ' Kč' : 'Bez limitu'}

            Zvolené komponenty:
            ${JSON.stringify(cart, null, 2)}
            Celková cena sestavy: ${totalPrice} Kč

            Pravidla funkčnosti (Kritické chyby - pokud něco nesedí, functional=false):
            1. Musí mít přesně 1x CPU, 1x MB, 1x RAM, 1x Úložiště (Storage), 1x Zdroj (PSU), 1x Skříň (Case). Pokud něco z tohoto chybí, sestava je nefunkční. (Monitor a GPU mohou chybět dle dalších pravidel).
            2. Socket CPU a MB se musí přesně shodovat (např. obojí AM4, nebo obojí LGA1700). Jinak procesor nezapadne do desky.
            3. Typ RAM (DDR4/DDR5) v RAM a podpora pamětí na MB se musí přesně shodovat.
            4. Pokud vybraný CPU má vlastnost "igpu: false" a sestava neobsahuje žádnou dedikovanou GPU, sestava nezobrazí obraz, a proto functional=false.

            Bodování (pokud je functional=true):
            - Začni na 100 bodech.
            - Strhni 20 bodů za nedodržení rozpočtu.
            - Strhni 20 bodů, pokud byl v požadavcích vyžadován monitor a chybí.
            - Strhni 20 bodů, pokud byl výslovně vyžadován určitý výrobce procesoru (Intel/AMD) a nebyl dodržen.
            - Strhni 15 bodů za zásadní nevyváženost výkonu.
            - Strhni 15 bodů za slabý zdroj (např. 400W pro RTX 4070 SUPER je nesmysl, sestava by spadla).

            Odpověz POUZE v tomto čistém JSON formátu (bez markdown značek \`\`\`json apod.):
            {
              "functional": true/false,
              "score": číslo 0-100,
              "feedback": "Váš text hodnocení v češtině, vysvětlující proč sestava nefunguje (pokud false), nebo důvod srážky bodů."
            }`;

            for (let i = 0; i <= delays.length; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: fullPrompt }] }],
                            generationConfig: { 
                                responseMimeType: "application/json",
                                responseSchema: {
                                    type: "OBJECT",
                                    properties: {
                                        functional: { type: "BOOLEAN" },
                                        score: { type: "INTEGER" },
                                        feedback: { type: "STRING" }
                                    },
                                    required: ["functional", "score", "feedback"]
                                }
                            }
                        })
                    });
                    if (!response.ok) throw new Error(`API Error ${response.status}`);
                    const data = await response.json();
                    const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    if(!text) throw new Error("Empty response");
                    return JSON.parse(text);
                } catch (error) {
                    // Jakmile to vyhodí chybu sítě/400 (např. chybějící API klíč na Github pages), přesměrujeme to na lokální.
                    if (i === delays.length - 1) {
                        return evaluateLocally(cart, level, totalPrice);
                    }
                    await new Promise(res => setTimeout(res, delays[i]));
                }
            }
        }

        // --- MAIN APP COMPONENT ---
        function App() {
            const [user, setUser] = useState(null);
            const [screen, setScreen] = useState("login");
            const [playerName, setPlayerName] = useState("");
            
            const [level, setLevel] = useState(null);
            const [cart, setCart] = useState({...emptyCart});
            const [timeLeft, setTimeLeft] = useState(0);
            const [gameState, setGameState] = useState('idle');
            const [totalScore, setTotalScore] = useState(0);
            const [evaluation, setEvaluation] = useState(null);
            const [leaderboard, setLeaderboard] = useState([]);
            const [activeTab, setActiveTab] = useState('CPU');

            useEffect(() => {
                if (auth) {
                    const initAuth = async () => {
                        try {
                            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                                await signInWithCustomToken(auth, __initial_auth_token);
                            } else {
                                await signInAnonymously(auth);
                            }
                        } catch (e) {
                            console.warn("Nelze se přihlásit:", e);
                        }
                    };
                    initAuth();
                    const unsubscribe = onAuthStateChanged(auth, setUser);
                    return () => unsubscribe();
                } else {
                    // Offline režim (bez firebase configu)
                    setUser({ uid: 'offline-player' });
                }
            }, []);

            useEffect(() => {
                if (!user || !db) return;
                try {
                    const lbRef = collection(db, 'artifacts', appId, 'public', 'data', 'pc_leaderboard');
                    const unsubscribe = onSnapshot(lbRef, (snapshot) => {
                        const scores = [];
                        snapshot.forEach(doc => scores.push({ id: doc.id, ...doc.data() }));
                        scores.sort((a, b) => b.score - a.score);
                        setLeaderboard(scores);
                    }, (error) => {
                        console.error("Firebase listen error", error);
                    });
                    return () => unsubscribe();
                } catch(e) { console.warn("Žebříček není dostupný"); }
            }, [user]);

            useEffect(() => {
                let timer;
                if (gameState === 'playing' && timeLeft > 0) {
                    timer = setInterval(() => setTimeLeft(prev => prev - 1), 1000);
                } else if (gameState === 'playing' && timeLeft === 0) {
                    handleEvalBuild();
                }
                return () => clearInterval(timer);
            }, [gameState, timeLeft]);

            const startGame = () => {
                setTotalScore(0);
                const firstLevel = generateLevel(1);
                setLevel(firstLevel);
                setCart({...emptyCart});
                setTimeLeft(firstLevel.time);
                setGameState('playing');
                setScreen('game');
            };

            const handleNextLevel = () => {
                const nextIndex = level.index + 1;
                setTotalScore(prev => prev + evaluation.score);
                const newLevel = generateLevel(nextIndex);
                setLevel(newLevel);
                setCart({...emptyCart});
                setTimeLeft(newLevel.time);
                setGameState('playing');
                setScreen('game');
            };

            const addToCart = (category, item) => setCart(prev => ({ ...prev, [category]: item }));
            
            const getTotalPrice = () => Object.values(cart).reduce((sum, item) => sum + (item ? item.price : 0), 0);

            const handleEvalBuild = async () => {
                setGameState('idle');
                setScreen('evaluating');
                const price = getTotalPrice();
                const result = await callGeminiWithBackoff(cart, level, price);
                setEvaluation(result);
                setScreen('result');
            };

            const handleGameOver = async () => {
                const currentRoundScore = (evaluation && evaluation.functional) ? evaluation.score : 0;
                const finalScore = totalScore + currentRoundScore; 
                
                if (user && db && finalScore > 0) {
                    try {
                        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'pc_leaderboard', user.uid);
                        const docSnap = await getDoc(docRef);
                        if (docSnap.exists()) {
                            const existingScore = docSnap.data().score;
                            if (finalScore > existingScore) {
                                await setDoc(docRef, { name: playerName, score: finalScore }, { merge: true });
                            }
                        } else {
                            await setDoc(docRef, { name: playerName, score: finalScore });
                        }
                    } catch (e) {
                        console.error("Nelze uložit skóre", e);
                    }
                }
                setScreen('leaderboard');
            };

            const renderWin98Styles = () => (
                <style dangerouslySetInnerHTML={{__html: `
                    .win98-app { font-family: 'Tahoma', 'Segoe UI', Arial, sans-serif; background-color: #008080; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; color: #000; }
                    .window { background: #c0c0c0; border-top: 2px solid #ffffff; border-left: 2px solid #ffffff; border-right: 2px solid #000000; border-bottom: 2px solid #000000; box-shadow: inset 1px 1px #dfdfdf, inset -1px -1px #808080; padding: 2px; width: 100%; max-width: 900px; }
                    .window.small { max-width: 400px; }
                    .title-bar { background: linear-gradient(90deg, #000080, #1084d0); color: white; padding: 3px 6px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
                    .window-body { padding: 10px; }
                    .inset { background: #ffffff; border-top: 2px solid #808080; border-left: 2px solid #808080; border-right: 2px solid #ffffff; border-bottom: 2px solid #ffffff; box-shadow: inset 1px 1px #000; padding: 8px; }
                    .btn { background: #c0c0c0; border-top: 2px solid #ffffff; border-left: 2px solid #ffffff; border-right: 2px solid #000000; border-bottom: 2px solid #000000; box-shadow: inset 1px 1px #dfdfdf, inset -1px -1px #808080; padding: 4px 12px; cursor: pointer; font-family: inherit; font-size: 13px; display: flex; align-items: center; gap: 6px; color: #000; }
                    .btn:active { border-top: 2px solid #000000; border-left: 2px solid #000000; border-right: 2px solid #ffffff; border-bottom: 2px solid #ffffff; box-shadow: inset 1px 1px #808080; padding: 5px 11px 3px 13px; }
                    .btn:disabled { color: #808080; text-shadow: 1px 1px #fff; cursor: not-allowed; }
                    .tab-container { display: flex; flex-wrap: wrap; gap: 2px; margin-bottom: -2px; z-index: 1; position: relative; }
                    .tab { background: #c0c0c0; border-top: 2px solid #ffffff; border-left: 2px solid #ffffff; border-right: 2px solid #000000; border-bottom: none; padding: 4px 8px; cursor: pointer; margin-top: 4px; border-radius: 3px 3px 0 0; }
                    .tab.active { margin-top: 0; padding-bottom: 6px; background: #c0c0c0; font-weight: bold; z-index: 2; }
                    .tab-content { border-top: 2px solid #ffffff; border-left: 2px solid #ffffff; border-right: 2px solid #000000; border-bottom: 2px solid #000000; padding: 10px; background: #c0c0c0; height: 400px; overflow-y: auto; }
                    .item-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #a0a0a0; padding: 6px 0; }
                    .item-row:last-child { border-bottom: none; }
                    input[type="text"] { background: #ffffff; border-top: 2px solid #808080; border-left: 2px solid #808080; border-right: 2px solid #ffffff; border-bottom: 2px solid #ffffff; padding: 4px; font-family: inherit; width: 100%; box-sizing: border-box; }
                    .status-bar { border-top: 2px solid #808080; border-left: 2px solid #808080; border-right: 2px solid #ffffff; border-bottom: 2px solid #ffffff; margin-top: 10px; padding: 2px 6px; font-size: 12px; color: #333; display: flex; justify-content: space-between; }
                    .crt-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.05) 50%); background-size: 100% 4px; pointer-events: none; z-index: 9999; }
                    .desktop-icon { display: flex; flex-direction: column; align-items: center; width: 80px; text-align: center; color: white; cursor: pointer; position: absolute; top: 20px; left: 20px; gap: 4px; }
                    .desktop-icon:active { filter: brightness(0.8); }
                    @keyframes loading { 0% {width: 0%;} 50% {width: 70%;} 100% {width: 100%;} }
                `}} />
            );

            if (screen === 'login') {
                return (
                    <div className="win98-app">
                        {renderWin98Styles()}
                        <div className="crt-overlay"></div>
                        <div className="window small">
                            <div className="title-bar">
                                <span>Přihlášení do sítě</span>
                                <div className="flex gap-1"><button className="btn" style={{padding: '0 4px', height: '18px'}}>X</button></div>
                            </div>
                            <div className="window-body">
                                <div className="flex items-center gap-4 mb-4">
                                    <User size={32} />
                                    <p>Zadejte uživatelské jméno pro přihlášení do systému PC Builder Pro.</p>
                                </div>
                                <div className="mb-4">
                                    <label className="block mb-1">Uživatelské jméno:</label>
                                    <input type="text" value={playerName} onChange={(e) => setPlayerName(e.target.value)} placeholder="Např. LTT_Fan_99" maxLength={20}/>
                                </div>
                                <div className="flex justify-end gap-2">
                                    <button className="btn" onClick={() => playerName.trim() && setScreen('menu')} disabled={!playerName.trim()}>OK</button>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            if (screen === 'menu') {
                return (
                    <div className="win98-app">
                        {renderWin98Styles()}
                        <div className="crt-overlay"></div>
                        <div className="desktop-icon" onDoubleClick={startGame}>
                            <Monitor size={48} color="#00ff00" style={{background: '#000', border: '2px solid #fff'}} />
                            <span style={{backgroundColor: '#000080', padding: '2px', fontSize: '12px'}}>PC Builder.exe</span>
                        </div>
                        
                        <div className="window small" style={{position: 'absolute', top: '50%', left: '50%', transform: 'translate(-50%, -50%)'}}>
                            <div className="title-bar">
                                <span>PC Builder Pro '98</span>
                            </div>
                            <div className="window-body text-center">
                                <h1 className="text-xl font-bold mb-4 mt-2">Vítejte, {playerName}!</h1>
                                <p className="mb-6 text-sm">Dokážete splnit všechny požadavky zákazníků v časovém limitu a vyhnout se modré obrazovce smrti?</p>
                                <div className="flex flex-col gap-3 px-8">
                                    <button className="btn justify-center text-lg py-2 font-bold" onClick={startGame}><Play size={20} /> Nová hra</button>
                                    <button className="btn justify-center" onClick={() => setScreen('leaderboard')}><Trophy size={18} /> Žebříček (Leaderboard)</button>
                                    <button className="btn justify-center" onClick={() => setScreen('login')}><LogOut size={18} /> Odhlásit se</button>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            if (screen === 'game' && level) {
                return (
                    <div className="win98-app items-start pt-10">
                        {renderWin98Styles()}
                        <div className="crt-overlay"></div>
                        <div className="window w-full">
                            <div className="title-bar">
                                <span>Objednávkový systém - Úroveň {level.index}</span>
                                <span>{timeLeft} sekund zbývá</span>
                            </div>
                            <div className="window-body flex flex-col md:flex-row gap-4">
                                <div className="w-full md:w-1/4 flex flex-col gap-4">
                                    <div className="window">
                                        <div className="title-bar" style={{background: '#808080'}}><span className="flex items-center gap-1"><Mail size={14}/> Nová Zpráva</span></div>
                                        <div className="window-body">
                                            <div className="inset bg-yellow-50 text-sm h-40 overflow-y-auto mb-2 font-serif">"{level.text}"</div>
                                            <div className="flex items-center gap-2 font-bold text-red-600 mb-2"><Clock size={16}/> Čas běží: {timeLeft}s</div>
                                            <div className="text-xs"><strong>Skóre zatím:</strong> {totalScore}</div>
                                        </div>
                                    </div>
                                </div>
                                <div className="w-full md:w-2/4">
                                    <div className="tab-container">
                                        {Object.keys(componentsDB).map(cat => (
                                            <div key={cat} className={`tab ${activeTab === cat ? 'active' : ''}`} onClick={() => setActiveTab(cat)}>{cat}</div>
                                        ))}
                                    </div>
                                    <div className="tab-content">
                                        {componentsDB[activeTab].map(item => (
                                            <div key={item.id} className="item-row">
                                                <div>
                                                    <div className="font-bold">{item.name}</div>
                                                    <div className="text-xs text-gray-700">{item.desc}</div>
                                                </div>
                                                <div className="flex items-center gap-3">
                                                    <span className="font-bold whitespace-nowrap">{item.price} Kč</span>
                                                    <button className="btn" onClick={() => addToCart(activeTab, item)}>Přidat</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                <div className="w-full md:w-1/4">
                                    <div className="window h-full flex flex-col">
                                        <div className="title-bar" style={{background: '#808080'}}><span>Košík a Sestava</span></div>
                                        <div className="window-body flex-1 flex flex-col">
                                            <div className="inset flex-1 overflow-y-auto mb-4 p-2 text-sm bg-gray-50">
                                                {Object.entries(categoryLabels).map(([key, label]) => {
                                                    const item = cart[key];
                                                    return (
                                                        <div key={key} className="mb-2 pb-1 border-b border-gray-300 border-dashed">
                                                            <div className="font-bold text-gray-600">{label}:</div>
                                                            {item ? <div className="text-green-800 font-bold break-words">{item.name}</div> : <div className="text-red-600 italic">Chybí</div>}
                                                        </div>
                                                    )
                                                })}
                                            </div>
                                            <div className="mb-4 text-right"><span className="text-xl font-bold">Celkem: {getTotalPrice()} Kč</span></div>
                                            <button className="btn py-2 text-base font-bold justify-center" onClick={handleEvalBuild}><Check size={18} /> Odeslat sestavu</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div className="status-bar">
                                <span>Připraveno</span>
                                <span>Uživatel: {playerName}</span>
                            </div>
                        </div>
                    </div>
                );
            }

            if (screen === 'evaluating') {
                return (
                    <div className="win98-app">
                        {renderWin98Styles()}
                        <div className="crt-overlay"></div>
                        <div className="window small">
                            <div className="title-bar"><span>Diagnostika a hodnocení...</span></div>
                            <div className="window-body text-center py-8">
                                <Database className="animate-pulse mx-auto mb-4" size={48} />
                                <p className="font-bold mb-2">Kompiluji ovladače a kontroluji kompatibilitu...</p>
                                <p className="text-sm">Umělá inteligence / Systém analyzuje funkčnost sestavy.</p>
                                <div className="inset h-6 mt-4 p-0">
                                    <div className="h-full bg-blue-800" style={{width: '60%', animation: 'loading 2s infinite'}}></div>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            if (screen === 'result' && evaluation) {
                const isSuccess = evaluation.functional;
                const currentTotal = totalScore + (isSuccess ? evaluation.score : 0);
                
                return (
                    <div className="win98-app">
                        {renderWin98Styles()}
                        <div className="crt-overlay"></div>
                        <div className="window" style={{maxWidth: '600px'}}>
                            <div className="title-bar" style={{background: isSuccess ? '#000080' : '#800000'}}>
                                <span>{isSuccess ? 'Zpráva z testovací laboratoře' : 'FATAL ERROR - Modrá smrt'}</span>
                            </div>
                            <div className="window-body">
                                <div className="flex items-start gap-4 mb-4">
                                    {isSuccess ? <Check size={48} color="green" /> : <AlertTriangle size={48} color="red" />}
                                    <div>
                                        <h2 className="text-xl font-bold mb-1">{isSuccess ? 'Sestava úspěšně nabootovala!' : 'Sestava nefunguje (GAME OVER)'}</h2>
                                        {isSuccess ? (
                                            <>
                                                <p className="text-sm">Získané skóre za tuto zakázku: <strong>{evaluation.score}</strong> / 100</p>
                                                <p className="text-lg text-green-800">Celkové skóre k zápisu: <strong>{currentTotal}</strong></p>
                                            </>
                                        ) : (
                                            <>
                                                <p className="text-sm">Kritická chyba! Tato zakázka je za 0 bodů.</p>
                                                <p className="text-lg text-red-800">Konečné skóre k zápisu: <strong>{currentTotal}</strong></p>
                                            </>
                                        )}
                                    </div>
                                </div>
                                <div className="inset bg-gray-100 p-4 mb-4 text-sm font-serif min-h-[100px] whitespace-pre-wrap">{evaluation.feedback}</div>
                                <div className="flex justify-end gap-2">
                                    {isSuccess ? (
                                        <>
                                            <button className="btn" onClick={handleGameOver}>Ukončit směnu (Uložit skóre)</button>
                                            <button className="btn font-bold" onClick={handleNextLevel}>Další zakázka</button>
                                        </>
                                    ) : (
                                        <button className="btn font-bold" onClick={handleGameOver}>Pokračovat do menu</button>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            if (screen === 'leaderboard') {
                return (
                    <div className="win98-app">
                        {renderWin98Styles()}
                        <div className="crt-overlay"></div>
                        <div className="window" style={{maxWidth: '600px'}}>
                            <div className="title-bar">
                                <span>Síň slávy (Leaderboard)</span>
                                <button className="btn" style={{padding: '0 4px', height: '18px'}} onClick={() => setScreen('menu')}>X</button>
                            </div>
                            <div className="window-body">
                                <div className="inset h-80 overflow-y-auto mb-4 bg-white p-0">
                                    <table className="w-full text-sm text-left border-collapse">
                                        <thead className="bg-gray-200 border-b-2 border-gray-400 sticky top-0">
                                            <tr>
                                                <th className="p-2 border-r border-gray-300">Pořadí</th>
                                                <th className="p-2 border-r border-gray-300">Jméno hráče</th>
                                                <th className="p-2">Celkové skóre</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {db ? (
                                                leaderboard.length === 0 ? (
                                                    <tr><td colSpan="3" className="p-4 text-center text-gray-500">Načítám nebo nejsou k dispozici data.</td></tr>
                                                ) : (
                                                    leaderboard.map((entry, idx) => (
                                                        <tr key={entry.id} className={`${idx % 2 === 0 ? 'bg-white' : 'bg-gray-50'} hover:bg-blue-100`}>
                                                            <td className="p-2 border-r border-gray-200 font-bold">{idx + 1}.</td>
                                                            <td className="p-2 border-r border-gray-200">{entry.name}</td>
                                                            <td className="p-2 font-bold text-green-700">{entry.score}</td>
                                                        </tr>
                                                    ))
                                                )
                                            ) : (
                                                <tr><td colSpan="3" className="p-4 text-center text-red-600 font-bold">Zde mimo bezpečný náhled potřebuje žebříček vaši vlastní databázi. Pokyny vizte v kódu (řádky 30 a 240).</td></tr>
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                                <div className="flex justify-between items-center">
                                    <button className="btn" onClick={() => setScreen('menu')}>Zpět do menu</button>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            return null;
        }

        // Vykreslení React aplikace
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
